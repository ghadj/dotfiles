# Settings & Environment Controls {{{

# Optimize terminal colors and enable true-color (RGB) passthrough
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Eradicate Escape-Key delay to ensure instant Neovim mode switching
set -s escape-time 10

# Enable focus-events so Neovim buffers can auto-read changes instantly
set -g focus-events on

# Define Primary and Secondary Global Prefix Hooks
set -g prefix C-b
set -g prefix2 C-s

# Start window and pane numbering schemes at 1 to align with keyboard layout
set -g base-index 1
set-window-option -g pane-base-index 1

# Automatically renumber windows sequentially when intermediate layouts close
set -g renumber-windows on

# Expand history capacity threshold for deep buffer analytics
set -g history-limit 50000

# Enable full mouse engine (Allows pane resizing, scrollback scrolling, and selections)
set -g mouse on

# Prevent unexpected workflow drops by turning off client suspension loops
unbind-key C-z

# Maintain status bar transparency to complement editor aesthetics
set -g status-style "bg=default"

# Fast Configuration Hot-Reload
bind R source-file ~/.tmux.conf \; display-message "Configuration Reloaded."
# }}}

# Key Bindings & Navigational Overrides {{{

# Use | and - to split windows vertically and horizontally while tracking paths
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Enforce native Vi key structures across internal Tmux modes
setw -g mode-keys vi

# High-Velocity Pane Navigation (Vim-Style)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Repeatable Asynchronous Window Switching
bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+

# Repeatable Window Pane Resizing Matrices
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Synchronize inputs across all visible panes simultaneously
bind a set-window-option synchronize-panes

# Immediate backward string discovery filter
bind-key / copy-mode \; send-key ?

# Extract active pane to an independent window layout
bind b break-pane
# }}}

# Copy-Mode-Vi Buffer Pipelines (macOS Native) {{{

# Align copy-mode selection operators with classic Vim buffers
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'V' send -X select-line
bind-key -T copy-mode-vi 'r' send -X rectangle-toggle

# Pipe yank outputs cleanly straight into the macOS system pasteboard
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"
# }}}

